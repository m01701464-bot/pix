name: Build Pix APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Pix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pix-apk
          path: Pix.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.${{ github.run_number }}"
          gh release create "$TAG" Pix.apk --repo "${{ github.repository }}" --title "Пикс $TAG" --notes "Автосборка APK. Скачай Pix.apk ниже." --latest
