# Сборщик APK «Пикс»: весь проект упакован внутри этого файла.
# Положи файл в .github/workflows/ своего репозитория — GitHub соберёт APK сам.
name: Build Pix APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack project
        run: echo "$PIX_SRC" | base64 -d | tar xz
        env:
          PIX_SRC: 
      - name: Build APK
        run: |
          cd Pix
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Pix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pix-apk
          path: Pix.apk
